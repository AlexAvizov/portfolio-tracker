<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Portfolio Tracker</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --accent: #4f8ef7;
    --accent2: #7c3aed;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #f59e0b;
    --text: #e2e8f0;
    --text-muted: #8892a4;
    --radius: 10px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--surface) 0%, var(--surface2) 100%);
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .logo { font-size: 22px; font-weight: 700; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .price-badge {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 14px;
    display: flex; align-items: center; gap: 8px;
    font-size: 13px;
  }
  .price-badge .ticker { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  .price-badge .price-val { font-weight: 700; font-size: 17px; color: var(--accent); }
  .price-badge .chg { font-size: 12px; }
  .up { color: var(--green); }
  .dn { color: var(--red); }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .price-status { font-size: 11px; color: var(--text-muted); }
  .btn-upload {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 7px;
    padding: 8px 18px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    transition: opacity 0.15s;
  }
  .btn-upload:hover { opacity: 0.85; }
  input[type=file] { display: none; }

  main { padding: 24px 28px; }

  .summary-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
  }
  .stat-card .label { color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .stat-card .value { font-size: 20px; font-weight: 700; }

  .section-title {
    font-size: 15px; font-weight: 600; margin-bottom: 12px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-title .badge {
    background: var(--accent); color: #fff; font-size: 11px;
    padding: 2px 7px; border-radius: 20px;
  }

  .table-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow-x: auto;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr { background: var(--surface2); }
  th {
    padding: 11px 14px;
    text-align: left;
    color: var(--text-muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
  }
  th:hover { color: var(--text); }
  th .sort-arrow { margin-left: 4px; opacity: 0.4; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent); }
  td {
    padding: 11px 14px;
    border-top: 1px solid var(--border);
    white-space: nowrap;
  }
  tbody tr { transition: background 0.1s; }
  tbody tr:hover { background: var(--surface2); cursor: pointer; }
  tbody tr.active-row { background: rgba(79,142,247,0.1); border-left: 3px solid var(--accent); }

  .symbol-cell { font-weight: 700; font-size: 13px; color: var(--accent); }
  .name-cell { color: var(--text-muted); }
  .num { text-align: right; }
  .pill {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .pill-up { background: rgba(34,197,94,0.15); color: var(--green); }
  .pill-dn { background: rgba(239,68,68,0.15); color: var(--red); }
  .pill-zero { background: rgba(148,163,184,0.15); color: var(--text-muted); }

  .detail-panel {
    display: none;
    margin-top: 4px;
  }
  .detail-panel.visible { display: block; }
  .detail-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .detail-title { font-size: 15px; font-weight: 600; }
  .detail-subtitle { color: var(--text-muted); font-size: 12px; margin-top: 2px; }
  .btn-close {
    background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); border-radius: 6px; padding: 5px 12px;
    cursor: pointer; font-size: 12px;
  }
  .btn-close:hover { background: var(--border); }

  .loading {
    display: flex; align-items: center; gap: 8px;
    color: var(--text-muted); font-size: 12px; padding: 8px 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 14px; height: 14px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }
  .inline-price-badge {
    display: inline-flex; flex-direction: column; align-items: flex-end;
    gap: 2px; line-height: 1.2;
  }
  .inline-price-badge .ipt { color: var(--text-muted); font-size: 10px; letter-spacing: 0.04em; }
  .inline-price-badge .ipv { font-weight: 700; font-size: 14px; color: var(--accent); }
  .inline-price-badge .ipc { font-size: 11px; font-weight: 600; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px 18px;
    box-shadow: var(--shadow); font-size: 13px;
    transition: opacity 0.3s; z-index: 999;
  }
  .toast.hidden { opacity: 0; pointer-events: none; }

  .empty-state {
    text-align: center; padding: 48px 24px; color: var(--text-muted);
  }
  .empty-state svg { margin-bottom: 12px; opacity: 0.3; }

  .currency-section {
    margin-bottom: 40px;
  }
  .currency-section-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 2px solid var(--border);
  }
  .currency-flag { font-size: 22px; }
  .currency-name { font-size: 18px; font-weight: 700; }
  .currency-symbol {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 10px;
    font-size: 12px; font-weight: 600; color: var(--text-muted);
  }

  .detail-panel {
    display: none;
    margin-top: 4px;
    padding: 0 28px 28px;
  }
  .detail-panel.visible { display: block; }

  /* ── CRUD buttons ── */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 12px; flex-wrap: wrap;
  }
  .btn {
    border: none; border-radius: 7px; padding: 7px 14px;
    cursor: pointer; font-size: 12px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 5px;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.82; }
  .btn-add  { background: var(--green);  color: #fff; }
  .btn-edit { background: var(--accent); color: #fff; }
  .btn-del  { background: var(--red);    color: #fff; }
  .btn-sm   { padding: 4px 10px; font-size: 11px; }

  /* ── Modal overlay ── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.65); z-index: 1000;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 28px 32px; width: 100%; max-width: 480px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6);
  }
  .modal h3 { font-size: 16px; font-weight: 700; margin-bottom: 20px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .form-grid .full { grid-column: 1 / -1; }
  .form-group { display: flex; flex-direction: column; gap: 5px; }
  .form-group label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .form-group input, .form-group select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: 7px; padding: 8px 12px; color: var(--text);
    font-size: 13px; outline: none;
  }
  .form-group input:focus, .form-group select:focus { border-color: var(--accent); }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 22px; }
  .btn-cancel { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 7px; padding: 8px 18px; cursor: pointer; font-size: 13px; }
  .btn-save   { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; border-radius: 7px; padding: 8px 20px; cursor: pointer; font-size: 13px; font-weight: 600; }

  /* ── Confirm dialog ── */
  .confirm-box {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 24px 28px; width: 100%; max-width: 360px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.6); text-align: center;
  }
  .confirm-box p { margin-bottom: 18px; line-height: 1.5; }
  .confirm-actions { display: flex; gap: 10px; justify-content: center; }

  @media (max-width: 640px) {
    header, main { padding: 14px 16px; }
    .summary-bar { grid-template-columns: 1fr 1fr; }
    .form-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="logo">📈 Portfolio Tracker</div>
    <div id="sapPriceBadge" class="price-badge" style="display:none">
      <span class="ticker">SAP</span>
      <span class="price-val" id="sapPrice"></span>
      <span class="chg" id="sapChg"></span>
    </div>
  </div>
  <div class="header-right">
    <span class="price-status" id="priceStatus">Fetching live price…</span>
    <label class="btn-upload" for="fileUpload">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      Upload Excel
    </label>
    <input type="file" id="fileUpload" accept=".xlsx,.xls">
  </div>
</header>

<main id="sectionsRoot">
  <!-- Currency sections rendered dynamically by JS -->
</main>

<!-- Detail panel (shared, appended to active section by JS) -->
<div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div>
        <div class="detail-title" id="detailTitle"></div>
        <div class="detail-subtitle" id="detailSubtitle"></div>
      </div>
      <button class="btn-close" onclick="closeDetail()">✕ Close</button>
    </div>
    <div class="toolbar">
      <button class="btn btn-add" id="detailAddBtn">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Transaction
      </button>
    </div>
    <div class="table-wrap">
      <table id="detailTable">
        <thead>
          <tr>
            <th>Symbol</th>
            <th>Name</th>
            <th>Purchase Date</th>
            <th class="num">Quantity</th>
            <th class="num">Purchase Price</th>
            <th class="num">Current Price</th>
            <th class="num">Diff</th>
            <th class="num">Diff %</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="detailBody"></tbody>
      </table>
    </div>
</div>

<div class="toast hidden" id="toast"></div>

<!-- ── Add / Edit transaction modal ── -->
<div class="modal-overlay" id="txModal">
  <div class="modal">
    <h3 id="modalTitle">Add Transaction</h3>
    <div class="form-grid">
      <div class="form-group full">
        <label>Stock Symbol</label>
        <input id="fSymbol" placeholder="e.g. 50724" autocomplete="off">
      </div>
      <div class="form-group full">
        <label>Stock Name</label>
        <input id="fName" placeholder="e.g. SAP AG-SPONSORE" autocomplete="off">
      </div>
      <div class="form-group">
        <label>Purchase Date</label>
        <input id="fDate" type="date">
      </div>
      <div class="form-group">
        <label>Currency</label>
        <select id="fCcy">
          <option value="EUR">EUR €</option>
          <option value="USD">USD $</option>
          <option value="ILS">ILS ₪</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input id="fQty" type="number" step="0.0001" placeholder="e.g. 5.25">
      </div>
      <div class="form-group">
        <label>Purchase Price</label>
        <input id="fPrice" type="number" step="0.01" placeholder="e.g. 172.50">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save"   onclick="saveTransaction()">Save</button>
    </div>
  </div>
</div>

<!-- ── Confirm delete dialog ── -->
<div class="modal-overlay" id="confirmModal">
  <div class="confirm-box">
    <p id="confirmMsg">Are you sure?</p>
    <div class="confirm-actions">
      <button class="btn-cancel" onclick="closeConfirm()">Cancel</button>
      <button class="btn btn-del" id="confirmOkBtn">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

// ─── Price fetching ────────────────────────────────────────────────────────────

async function fetchYahooQuote(yfSymbol, currency) {
  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${yfSymbol}?interval=1d&range=1d`;
    const r = await fetch(url, { signal: AbortSignal.timeout(8000) });
    if (!r.ok) return null;
    const d = await r.json();
    const meta  = d?.chart?.result?.[0]?.meta;
    const price = parseFloat(meta?.regularMarketPrice);
    const prev  = parseFloat(meta?.chartPreviousClose);
    if (!price || isNaN(price)) return null;
    const chg    = prev ? price - prev : null;
    const chgPct = prev ? ((price - prev) / prev) * 100 : null;
    return { price, prev, chg, chgPct, currency, symbol: yfSymbol, source: 'Yahoo Finance' };
  } catch(e) { return null; }
}

async function fetchAllPrices() {
  // Try server first (returns both EUR+USD in one call), fall back to direct Yahoo Finance
  try {
    const r = await fetch('http://localhost:8765/api/price', { signal: AbortSignal.timeout(4000) });
    if (r.ok) {
      const d = await r.json();
      if (d.EUR) prices['EUR'] = d.EUR;
      if (d.USD) prices['USD'] = d.USD;
      return;
    }
  } catch(e) { /* server not running */ }

  // Direct Yahoo Finance fallback
  const [eur, usd] = await Promise.all([
    fetchYahooQuote('SAP.DE', 'EUR'),
    fetchYahooQuote('SAP',    'USD'),
  ]);
  if (eur) prices['EUR'] = eur;
  if (usd) prices['USD'] = usd;
}

// ─── Helpers ──────────────────────────────────────────────────────────────────
const fmt = (n, dec=2) => n == null ? '—' : Number(n).toLocaleString('en-US', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtDate = d => d ? new Date(d).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric'}) : '—';
const ccySym = { EUR: '€', USD: '$', ILS: '₪' };

function pillHtml(val, suffix='%') {
  if (val == null) return '<span class="pill pill-zero">—</span>';
  const cls = val > 0 ? 'pill-up' : val < 0 ? 'pill-dn' : 'pill-zero';
  const sign = val > 0 ? '+' : '';
  return `<span class="pill ${cls}">${sign}${fmt(val)}${suffix}</span>`;
}

function renderPriceBadgeInline(ccy) {
  const p = priceData(ccy);
  if (!p) return '—';
  const sym = ccySym[ccy] ?? ccy;
  let chgHtml = '';
  if (p.chg != null) {
    const sign = p.chg >= 0 ? '+' : '';
    const cls  = p.chg >= 0 ? 'up' : 'dn';
    chgHtml = `<span class="ipc ${cls}">${sign}${fmt(p.chg)} (${sign}${fmt(p.chgPct)}%)</span>`;
  }
  return `<div class="inline-price-badge">
    <span class="ipt">${p.symbol} · ${p.source}</span>
    <span class="ipv">${sym} ${fmt(p.price)}</span>
    ${chgHtml}
  </div>`;
}

function showToast(msg, ms=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), ms);
}

// ─── Aggregate rows by symbol ─────────────────────────────────────────────────
function buildHoldings(rows, ccy) {
  const map = {};
  for (const r of rows) {
    const rowCcy = (r[5] ?? 'EUR').toUpperCase();
    if (rowCcy !== ccy) continue;
    const sym = (r[0]||'').replace(/\s/g,'');
    if (!map[sym]) map[sym] = { symbol: sym, name: r[1], rows: [] };
    map[sym].rows.push({ symbol: sym, name: r[1], qty: +r[2], purchasePrice: +r[3], date: r[4] });
  }
  const cur = currentPrice(ccy);
  return Object.values(map).map(g => {
    const totalQty  = g.rows.reduce((s, x) => s + x.qty, 0);
    const totalCost = g.rows.reduce((s, x) => s + x.qty * x.purchasePrice, 0);
    const avgPrice  = totalCost / totalQty;
    const totalValue = cur != null ? cur * totalQty : null;
    const pctChange  = cur != null ? ((cur * totalQty - totalCost) / totalCost) * 100 : null;
    const gainLoss   = cur != null ? (cur * totalQty - totalCost) : null;
    return { symbol: g.symbol, name: g.name, avgPrice, totalQty, totalCost, totalValue, pctChange, gainLoss, currentPrice: cur, rows: g.rows, ccy };
  });
}

// ─── Sort ─────────────────────────────────────────────────────────────────────
function applySort(arr) {
  if (!sortCol) return arr;
  return [...arr].sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (va == null) return 1; if (vb == null) return -1;
    if (typeof va === 'string') return sortDir * va.localeCompare(vb);
    return sortDir * (va - vb);
  });
}

// ─── Summary cards ────────────────────────────────────────────────────────────
function summaryHtml(holdings, ccy) {
  const sym = ccySym[ccy] ?? ccy;
  const cur = currentPrice(ccy);
  const totalInvested = holdings.reduce((s, h) => s + h.totalCost, 0);
  const totalValue    = cur != null ? holdings.reduce((s, h) => s + (h.totalValue || 0), 0) : null;
  const totalGain     = cur != null ? holdings.reduce((s, h) => s + (h.gainLoss  || 0), 0) : null;
  const totalPct      = totalInvested > 0 && totalGain != null ? (totalGain / totalInvested) * 100 : null;
  const totalShares   = holdings.reduce((s, h) => s + h.totalQty, 0);

  const cards = [
    { label: 'Total Invested',   value: `${sym} ${fmt(totalInvested)}`, cls: '' },
    { label: 'Current Value',    value: totalValue != null ? `${sym} ${fmt(totalValue)}` : '—', cls: '' },
    { label: 'Total Gain / Loss',value: totalGain  != null ? `${sym} ${fmt(totalGain)}`  : '—', cls: totalGain > 0 ? 'up' : totalGain < 0 ? 'dn' : '' },
    { label: 'Overall Return',   value: totalPct   != null ? `${totalPct >= 0 ? '+' : ''}${fmt(totalPct)}%` : '—', cls: totalPct > 0 ? 'up' : totalPct < 0 ? 'dn' : '' },
    { label: 'Total Shares',     value: fmt(totalShares, 4), cls: '' },
    { label: 'Holdings',         value: holdings.length, cls: '' },
  ];

  return `<div class="summary-bar">${cards.map(c => `
    <div class="stat-card">
      <div class="label">${c.label}</div>
      <div class="value ${c.cls}">${c.value}</div>
    </div>`).join('')}</div>`;
}

// ─── Render all sections ──────────────────────────────────────────────────────
function renderAll() {
  const root = document.getElementById('sectionsRoot');
  root.innerHTML = SECTIONS.map(sec => {
    const holdings = buildHoldings(rawRows, sec.id);
    return `<section class="currency-section" id="section-${sec.id}">
      <div class="currency-section-header">
        <span class="currency-flag">${sec.flag}</span>
        <span class="currency-name">${sec.label}</span>
        <span class="currency-symbol">${sec.id} ${sec.symbol}</span>
      </div>
      ${summaryHtml(holdings, sec.id)}
      <div class="section-title">Holdings <span class="badge">${holdings.length}</span></div>
      ${holdingsTableHtml(holdings, sec.id)}
    </section>`;
  }).join('');

  // Wire sort headers
  document.querySelectorAll('.holdings-table th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = 1; }
      document.querySelectorAll('.holdings-table th').forEach(t => {
        t.classList.remove('sorted');
        const arrow = t.querySelector('.sort-arrow');
        if (arrow) arrow.textContent = '↕';
      });
      th.classList.add('sorted');
      th.querySelector('.sort-arrow').textContent = sortDir > 0 ? '↑' : '↓';
      renderAll();
    });
  });

  // Re-attach detail panel to its section if open
  if (activeSymbol) {
    const h = buildHoldings(rawRows, activeCcy).find(x => x.symbol === activeSymbol);
    if (h) {
      const sec = document.getElementById(`section-${activeCcy}`);
      if (sec) sec.appendChild(document.getElementById('detailPanel'));
    }
  }
}

let activeCcy = null;

function toggleDetail(symbol, ccy) {

    activeSymbol = null; activeCcy = null;
    document.getElementById('detailPanel').classList.remove('visible');
    renderAll();

  }

function renderDetail(symbol, ccy) {
  const holdings = buildHoldings(rawRows, ccy);

  const cur = currentPrice(ccy);
  const sorted = [...h.rows].sort((a, b) => new Date(a.date) - new Date(b.date));

  // Add button above the detail table
  const addBtn = document.getElementById('detailAddBtn');
  if (addBtn) addBtn.onclick = () => openAddTransaction(symbol, h.name, ccy);

  document.getElementById('detailBody').innerHTML = sorted.map((r, i) => {
    const diff    = cur != null ? cur - r.purchasePrice : null;
    const diffPct = cur != null ? ((cur - r.purchasePrice) / r.purchasePrice) * 100 : null;
    const txIdx   = rawRows.findIndex(rr =>
      rr[0].replace(/\s/g,'') === symbol && +rr[2] === r.qty &&

      <td class="symbol-cell">${r.symbol}</td>

      <td class="num">${fmt(r.qty, 4)}</td>

  }).join('');

  if (sec) sec.appendChild(panel);
  panel.classList.add('visible');
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

function closeDetail() {
  activeSymbol = null; activeCcy = null;

// ─── Excel upload ─────────────────────────────────────────────────────────────
document.getElementById('fileUpload').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const wb  = XLSX.read(buf, { type: 'array', cellDates: true });
    let sheetName = wb.SheetNames.find(s => s.toLowerCase().replace(/[\s-]/g,'') === 'cleantable') || wb.SheetNames[0];
    const ws   = wb.Sheets[sheetName];
    const json = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

    let headerIdx = 0;
    for (let i = 0; i < Math.min(10, json.length); i++) {
      const rowStr = (json[i] || []).join('|').toLowerCase();
      if (rowStr.includes('symbol') || rowStr.includes('quantity') || rowStr.includes('stock')) { headerIdx = i; break; }
    }
    const headers = (json[headerIdx] || []).map(h => String(h||'').toLowerCase().trim());
    const colIdx  = name => headers.findIndex(h => h.includes(name));
    const symI    = Math.max(colIdx('symbol'), 0);
    const nameI   = colIdx('name')   >= 0 ? colIdx('name')   : 1;
    const qtyI    = colIdx('qty')    >= 0 ? colIdx('qty')    : colIdx('quantity');
    const priceI  = colIdx('purchase price') >= 0 ? colIdx('purchase price') : colIdx('price');
    const dateI   = colIdx('date');
    const ccyI    = colIdx('currency') >= 0 ? colIdx('currency') : colIdx('ccy');

    const newRows = [];
    for (let i = headerIdx + 1; i < json.length; i++) {
      const row = json[i];
      if (!row) continue;
      const sym = String(row[symI] || '').trim().replace(/\s+/g, '');
      if (!sym || sym === 'null') continue;
      const qty   = parseFloat(row[qtyI]);
      const price = parseFloat(row[priceI >= 0 ? priceI : 3]);
      if (isNaN(qty) || isNaN(price)) continue;
      let date = row[dateI >= 0 ? dateI : 4];
      if (date instanceof Date) date = date.toISOString().slice(0, 10);
      else if (typeof date === 'number') {
        const d = XLSX.SSF.parse_date_code(date);
        date = `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`;
      }
      const ccy = ccyI >= 0 ? String(row[ccyI] || 'EUR').trim().toUpperCase() : 'EUR';
      newRows.push([sym, String(row[nameI] || '').trim(), qty, price, date, ccy]);
    }
    if (!newRows.length) { showToast('⚠️ No valid rows found in file'); return; }

    // Import via API if server running, else localStorage
    try {
      const r = await fetch('http://localhost:8765/api/transactions/import', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rows: newRows }),
        signal: AbortSignal.timeout(5000),
      });
      if (r.ok) {
        await loadData();
        showToast(`✅ Loaded ${newRows.length} transactions from "${sheetName}" → saved to database`);
        closeDetail(); renderAll();
        return;
      }
    } catch(e) { /* server not running */ }

    // Fallback: localStorage
    rawRows = newRows;
    localStorage.setItem('stockPortfolioData', JSON.stringify(rawRows));
    closeDetail(); renderAll();
    showToast(`✅ Loaded ${newRows.length} transactions from "${sheetName}" (offline)`);
  } catch(err) {
    console.error(err);
    showToast('❌ Error reading file: ' + err.message);
  }
  e.target.value = '';
});

// ─── Data layer: API-first, localStorage fallback ─────────────────────────────
let useAPI = false;  // set to true once server responds

async function loadData() {
  try {
    const r = await fetch('http://localhost:8765/api/transactions', { signal: AbortSignal.timeout(3000) });
    if (r.ok) {
      useAPI = true;
      const rows = await r.json();
      if (rows.length) {
        // Convert DB rows → [symbol, name, qty, price, date, ccy]
        rawRows = rows.map(r => [r.symbol, r.name, r.quantity, r.purchase_price, r.purchase_date, r.currency]);
        rawRows._ids = rows.map(r => r.id);  // store DB ids for updates/deletes
        return;
      }
      // Server running but DB empty → seed with defaults and save
      if (DEFAULT_ROWS.length) {
        await fetch('http://localhost:8765/api/transactions/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ rows: DEFAULT_ROWS.map(r => [...r, 'EUR']) }),
        });
        const r2 = await fetch('http://localhost:8765/api/transactions');
        const seeded = await r2.json();
        rawRows = seeded.map(r => [r.symbol, r.name, r.quantity, r.purchase_price, r.purchase_date, r.currency]);
        rawRows._ids = seeded.map(r => r.id);
      }
      return;
    }
  } catch(e) { /* server offline */ }

  // Fallback: localStorage
  useAPI = false;
  try {
    const saved = localStorage.getItem('stockPortfolioData');
    if (saved) {
      const parsed = JSON.parse(saved);
      const valid = parsed.filter(r => Array.isArray(r) && r.length >= 4 && !isNaN(+r[2]) && !isNaN(+r[3]));
      if (valid.length) { rawRows = valid.map(r => [...r.slice(0,5), (r[5]??'EUR').toString().toUpperCase()]); return; }
    }
  } catch(e) {}
  rawRows = DEFAULT_ROWS.map(r => [...r, 'EUR']);
}

function getRowId(idx) {
  return rawRows._ids ? rawRows._ids[idx] : null;
}

async function persistAndRefresh() {
  if (useAPI) {
    // Re-load from DB to stay in sync (adds/edits/deletes already sent to API)
    await loadData();
  } else {
    localStorage.setItem('stockPortfolioData', JSON.stringify(rawRows));
  }
  renderAll();
  if (activeSymbol && activeCcy) renderDetail(activeSymbol, activeCcy);
}

let modalEditIdx = null;

function openAddHolding(ccy) {

}

function openAddTransaction(symbol, name, ccy) {
  modalEditIdx = null;
  document.getElementById('modalTitle').textContent = `Add Transaction — ${symbol}`;
  document.getElementById('fSymbol').value  = symbol;
  document.getElementById('fName').value    = name;
  document.getElementById('fDate').value    = new Date().toISOString().slice(0,10);

function openEditTransaction(idx) {
  const r = rawRows[idx];
  if (!r) return;
  modalEditIdx = idx;
  document.getElementById('modalTitle').textContent = 'Edit Transaction';
  document.getElementById('fSymbol').value  = r[0].replace(/\s/g,'');
  document.getElementById('fName').value    = r[1];
  document.getElementById('fDate').value    = r[4] ? r[4].slice(0,10) : '';
  document.getElementById('fCcy').value     = (r[5] ?? 'EUR').toUpperCase();
  document.getElementById('fQty').value     = r[2];
  document.getElementById('fPrice').value   = r[3];
  document.getElementById('fSymbol').readOnly = false;
  document.getElementById('fName').readOnly   = false;
  document.getElementById('txModal').classList.add('open');
}

function openEditHolding(symbol, ccy) {
  const idx = rawRows.findIndex(r => r[0].replace(/\s/g,'') === symbol && (r[5]??'EUR').toUpperCase() === ccy);
  if (idx >= 0) openEditTransaction(idx);
}

function closeModal() {
  document.getElementById('txModal').classList.remove('open');
  modalEditIdx = null;
}

async function saveTransaction() {
  const symbol = document.getElementById('fSymbol').value.trim();
  const name   = document.getElementById('fName').value.trim();
  const date   = document.getElementById('fDate').value.trim();
  const ccy    = document.getElementById('fCcy').value;
  const qty    = parseFloat(document.getElementById('fQty').value);
  const price  = parseFloat(document.getElementById('fPrice').value);

  if (!symbol)                   return showToast('⚠️ Symbol is required');
  if (!name)                     return showToast('⚠️ Name is required');
  if (!date)                     return showToast('⚠️ Date is required');
  if (isNaN(qty)   || qty   <= 0) return showToast('⚠️ Enter a valid quantity');
  if (isNaN(price) || price <= 0) return showToast('⚠️ Enter a valid price');

  const payload = { symbol, name, quantity: qty, purchase_price: price, purchase_date: date, currency: ccy };

  if (useAPI) {
    if (modalEditIdx !== null) {
      const id = getRowId(modalEditIdx);
      await fetch(`http://localhost:8765/api/transactions/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      showToast('✅ Transaction updated');
    } else {
      await fetch('http://localhost:8765/api/transactions', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload),
      });
      showToast('✅ Transaction added');
      activeSymbol = symbol; activeCcy = ccy;
    }
  } else {
    const row = [symbol, name, qty, price, date, ccy];
    if (modalEditIdx !== null) { rawRows[modalEditIdx] = row; showToast('✅ Transaction updated'); }
    else { rawRows.push(row); showToast('✅ Transaction added'); activeSymbol = symbol; activeCcy = ccy; }
  }

  closeModal();
  await persistAndRefresh();
}

function confirmDeleteHolding(symbol, ccy) {
  const count = rawRows.filter(r => r[0].replace(/\s/g,'') === symbol && (r[5]??'EUR').toUpperCase() === ccy).length;
  document.getElementById('confirmMsg').textContent =
    `Delete all ${count} transaction${count !== 1 ? 's' : ''} for ${symbol} (${ccy})? This cannot be undone.`;
  document.getElementById('confirmOkBtn').onclick = async () => {
    if (useAPI) {
      const ids = rawRows.reduce((acc, r, i) => {
        if (r[0].replace(/\s/g,'') === symbol && (r[5]??'EUR').toUpperCase() === ccy) acc.push(getRowId(i));
        return acc;
      }, []);
      await Promise.all(ids.map(id => fetch(`http://localhost:8765/api/transactions/${id}`, { method: 'DELETE' })));
    } else {
      rawRows = rawRows.filter(r => !(r[0].replace(/\s/g,'') === symbol && (r[5]??'EUR').toUpperCase() === ccy));
    }
    if (activeSymbol === symbol && activeCcy === ccy) { activeSymbol = null; activeCcy = null; }
    closeConfirm();
    await persistAndRefresh();
    showToast(`🗑️ Deleted all transactions for ${symbol}`);
  };
  document.getElementById('confirmModal').classList.add('open');
}

function confirmDeleteTransaction(idx) {
  const r = rawRows[idx];
  if (!r) return;
  document.getElementById('confirmMsg').textContent =
    `Delete: ${r[2]} shares of ${r[0].replace(/\s/g,'')} at ${ccySym[r[5]??'EUR']}${r[3]} on ${fmtDate(r[4])}?`;
  document.getElementById('confirmOkBtn').onclick = async () => {
    if (useAPI) {
      const id = getRowId(idx);
      await fetch(`http://localhost:8765/api/transactions/${id}`, { method: 'DELETE' });
    } else {
      rawRows.splice(idx, 1);
    }
    closeConfirm();
    await persistAndRefresh();
    showToast('🗑️ Transaction deleted');
  };
  document.getElementById('confirmModal').classList.add('open');
}

function closeConfirm() {
  document.getElementById('confirmModal').classList.remove('open');
}

document.getElementById('txModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
document.getElementById('confirmModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeConfirm(); });

// ─── Init ─────────────────────────────────────────────────────────────────────
async function init() {
  await loadData();
  renderAll();

  await fetchAllPrices();

  const eur = priceData('EUR');
  if (eur) {
    document.getElementById('sapPrice').textContent = `EUR ${fmt(eur.price)}`;
    if (eur.chg != null) {
      const sign = eur.chg >= 0 ? '+' : '';
      const cls  = eur.chg >= 0 ? 'up' : 'dn';
      document.getElementById('sapChg').innerHTML = `<span class="${cls}">${sign}${fmt(eur.chg)} (${sign}${fmt(eur.chgPct)}%)</span>`;
    }
    document.getElementById('sapPriceBadge').style.display = '';
  }

  const fetched = Object.keys(prices).join(', ') || 'none';
  const src = useAPI ? ' · DB' : ' · offline';
  document.getElementById('priceStatus').textContent =
    `Live: ${fetched}${src} · ${new Date().toLocaleTimeString()}`;
  if (!Object.keys(prices).length) {
    document.getElementById('priceStatus').innerHTML = '<span style="color:var(--yellow)">Price fetch failed</span>';
  }

  renderAll();
}

init();
</script>
